include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - avoid_print
    - camel_case_extensions
    - camel_case_types
    - constant_identifier_names
    - directives_ordering
    - file_names
    - library_prefixes
    - lines_longer_than_80_chars
    - non_constant_identifier_names
    - package_api_docs
    - package_names
    - public_member_api_docs
    - slash_for_doc_comments

name: wingle
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  flutter_riverpod: ^3.0.3
  flutter_native_splash: ^2.4.7
  adaptive_theme: ^3.7.2
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  hive_ce_generator: ^1.10.0
  firebase_core: ^4.2.1
  flutter_dotenv: ^6.0.0
  go_router: ^17.0.0
  riverpod_annotation: ^3.0.3
  riverpod_generator: ^3.0.3
  flutter_secure_storage: ^9.2.4
  dio: ^5.9.0
  json_annotation: ^4.9.0
  iconify_flutter: ^0.0.7
  colorful_iconify_flutter: ^0.0.5
  firebase_auth: ^6.1.2
  figma_squircle: ^0.6.3
  scroll_date_picker: ^3.8.0
  carousel_slider: ^5.1.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3
  build_runner: ^2.10.4
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/images/onboarding/
    - lib/app/config/env/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900